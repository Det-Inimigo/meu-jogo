<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truco Paulista — PlayHub</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0b0b12;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(30, 60, 114, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(114, 60, 30, 0.06) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e8e8f0;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 24px 28px 26px;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.8);
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .header .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .title-group .icon-symbol {
            font-size: 26px;
            font-weight: 800;
            color: #d4a54a;
            opacity: 0.6;
            font-family: 'Georgia', serif;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e8e8f0;
        }
        .header .score-group {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .header .score-group .dupla-a {
            color: #6b8af5;
            font-weight: 800;
            font-size: 20px;
        }
        .header .score-group .dupla-b {
            color: #d4a54a;
            font-weight: 800;
            font-size: 20px;
        }
        .header .score-group .vs {
            color: #3a3f55;
            font-weight: 600;
        }
        .header .score-group .label-pts {
            font-size: 9px;
            color: #4a4f6a;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        /* CONEXÃO */
        .connection-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .connection-area input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 8px 14px;
            color: #e8e8f0;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            width: 120px;
            outline: none;
            letter-spacing: 0.1em;
        }
        .connection-area input::placeholder {
            color: #3a3f55;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.04em;
        }
        .connection-area button {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: #aab4d6;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .connection-area button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
        }
        .connection-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .connection-area button.primary {
            background: rgba(91, 124, 250, 0.12);
            border-color: rgba(91, 124, 250, 0.15);
            color: #8ba4fa;
        }
        .connection-area button.primary:hover:not(:disabled) {
            background: rgba(91, 124, 250, 0.2);
        }
        .connection-area button.gold {
            background: rgba(212, 165, 74, 0.08);
            border-color: rgba(212, 165, 74, 0.12);
            color: #d4a54a;
        }
        .connection-area button.gold:hover:not(:disabled) {
            background: rgba(212, 165, 74, 0.15);
        }
        .connection-area .code-display {
            font-size: 22px;
            font-weight: 800;
            color: #d4a54a;
            letter-spacing: 0.12em;
            background: rgba(212, 165, 74, 0.06);
            padding: 4px 20px;
            border-radius: 8px;
            border: 1px solid rgba(212, 165, 74, 0.08);
            font-family: 'Inter', monospace;
        }
        .connection-area .label {
            color: #4a4f6a;
            font-size: 12px;
        }

        /* MESA */
        .mesa {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 18px;
            padding: 16px 18px;
            min-height: 180px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }
        .mesa.destaque {
            border-color: rgba(212, 165, 74, 0.15);
            box-shadow: inset 0 0 60px rgba(212, 165, 74, 0.02);
        }

        /* VIRA */
        .vira-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 12px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
        }
        .vira-area .label {
            font-size: 10px;
            color: #5a5f7a;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .vira-area .vira-card {
            display: inline-block;
            background: linear-gradient(145deg, #f5f0e8, #e8e0d5);
            border: 1.5px solid rgba(180, 160, 140, 0.3);
            border-radius: 8px;
            padding: 2px 12px;
            font-family: 'Georgia', serif;
            font-weight: 800;
            font-size: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            min-width: 40px;
            text-align: center;
        }
        .vira-area .vira-card .vira-vermelho {
            color: #cc2233;
        }
        .vira-area .vira-card .vira-preto {
            color: #1a1a2e;
        }
        .vira-area .manilha-info {
            font-size: 13px;
            color: #6a6f8a;
            font-weight: 500;
        }
        .vira-area .manilha-info strong {
            color: #d4a54a;
            font-weight: 700;
        }
        .vira-area .manilha-info .manilha-carta {
            display: inline-block;
            background: linear-gradient(145deg, #f5f0e8, #e8e0d5);
            border: 1px solid rgba(180, 160, 140, 0.3);
            border-radius: 4px;
            padding: 0 8px;
            font-family: 'Georgia', serif;
            font-weight: 800;
            font-size: 16px;
            margin: 0 1px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .vira-area .manilha-info .manilha-vermelho {
            color: #cc2233;
        }
        .vira-area .manilha-info .manilha-preto {
            color: #1a1a2e;
        }

        /* CARTAS NA MESA */
        .cartas-mesa {
            display: flex;
            justify-content: center;
            gap: 16px;
            min-height: 90px;
            align-items: center;
            flex-wrap: wrap;
            padding: 4px;
        }
        .cartas-mesa .empty-msg {
            color: #3a3f55;
            font-size: 13px;
            font-weight: 400;
        }

        .carta-mesa {
            background: linear-gradient(145deg, #f8f4ee, #ece4d8);
            border-radius: 10px;
            padding: 6px 12px 4px;
            min-width: 58px;
            min-height: 80px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            font-family: 'Georgia', serif;
            border: 1.5px solid rgba(180, 160, 140, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .carta-mesa .carta-valor {
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
        }
        .carta-mesa .carta-naipe {
            font-size: 20px;
            line-height: 1;
            margin-top: 1px;
        }
        .carta-mesa .carta-naipe-vermelho {
            color: #cc2233;
        }
        .carta-mesa .carta-naipe-preto {
            color: #1a1a2e;
        }
        .carta-mesa .jogador-nome {
            font-size: 8px;
            font-weight: 600;
            color: #4a4a5a;
            margin-top: 3px;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: rgba(0, 0, 0, 0.04);
            padding: 1px 8px;
            border-radius: 8px;
        }
        .carta-mesa.vencedor {
            border-color: #4caf84;
            box-shadow: 0 0 30px rgba(76, 175, 132, 0.2), 0 4px 20px rgba(0, 0, 0, 0.4);
            transform: scale(1.05) translateY(-4px);
        }
        .carta-mesa .badge-vencedor {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4caf84;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }

        /* JOGADORES */
        .jogadores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 14px;
        }
        .jogador-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 10px 14px;
            transition: all 0.3s ease;
        }
        .jogador-card.dupla-a {
            border-left: 3px solid rgba(91, 124, 250, 0.3);
        }
        .jogador-card.dupla-b {
            border-left: 3px solid rgba(212, 165, 74, 0.3);
        }
        .jogador-card.ativo {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .jogador-card.ativo .nome {
            color: #fff;
        }
        .jogador-card .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .jogador-card .nome {
            font-weight: 600;
            font-size: 13px;
            color: #aab4d6;
            transition: 0.3s;
        }
        .jogador-card .nome .indicador-vez {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4caf84;
            margin-right: 5px;
            animation: blinkDot 1s ease-in-out infinite;
        }
        @keyframes blinkDot {
            0%,
            100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .jogador-card .nome .badge-humano {
            font-size: 7px;
            background: rgba(91, 124, 250, 0.12);
            color: #6b8af5;
            padding: 1px 6px;
            border-radius: 8px;
            font-weight: 600;
            margin-left: 4px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        .jogador-card .badge-dupla {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 8px;
            border-radius: 16px;
            letter-spacing: 0.04em;
        }
        .badge-dupla.a {
            background: rgba(91, 124, 250, 0.12);
            color: #6b8af5;
        }
        .badge-dupla.b {
            background: rgba(212, 165, 74, 0.12);
            color: #d4a54a;
        }
        .jogador-card .cartas {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            min-height: 36px;
        }
        .jogador-card .carta-mao {
            background: linear-gradient(145deg, #f8f4ee, #ece4d8);
            border: 1.5px solid rgba(180, 160, 140, 0.25);
            border-radius: 6px;
            padding: 2px 8px 1px;
            min-width: 32px;
            min-height: 40px;
            text-align: center;
            font-family: 'Georgia', serif;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: default;
        }
        .jogador-card .carta-mao .carta-valor {
            font-size: 14px;
            font-weight: 800;
            line-height: 1;
        }
        .jogador-card .carta-mao .carta-naipe {
            font-size: 11px;
            line-height: 1;
        }
        .jogador-card .carta-mao .naipe-vermelho {
            color: #cc2233;
        }
        .jogador-card .carta-mao .naipe-preto {
            color: #1a1a2e;
        }
        .jogador-card .carta-mao.clickavel {
            cursor: pointer;
        }
        .jogador-card .carta-mao.clickavel:hover:not(.jogada) {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(91, 124, 250, 0.3);
        }
        .jogador-card .carta-mao.jogada {
            opacity: 0.15;
            transform: scale(0.85);
            filter: grayscale(1);
            cursor: not-allowed;
        }
        .jogador-card .carta-mao.bot-card {
            opacity: 0.08;
            cursor: default;
            background: linear-gradient(145deg, #1a1a2e, #12121f);
            border-color: rgba(255, 255, 255, 0.03);
        }
        .jogador-card .pontos-info {
            font-size: 9px;
            color: #4a4f6a;
            margin-top: 3px;
            font-weight: 500;
        }
        .jogador-card .pontos-info strong {
            color: #8b92b0;
        }

        /* AÇÕES */
        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
            justify-content: center;
        }
        .acoes button {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            color: #aab4d6;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .acoes button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .acoes button:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            transform: none;
        }
        .acoes button.btn-truco {
            background: rgba(212, 165, 74, 0.08);
            border-color: rgba(212, 165, 74, 0.12);
            color: #d4a54a;
        }
        .acoes button.btn-truco:hover:not(:disabled) {
            background: rgba(212, 165, 74, 0.15);
        }
        .acoes button.btn-aceitar {
            background: rgba(76, 175, 132, 0.08);
            border-color: rgba(76, 175, 132, 0.1);
            color: #4caf84;
        }
        .acoes button.btn-aceitar:hover:not(:disabled) {
            background: rgba(76, 175, 132, 0.15);
        }
        .acoes button.btn-fugir {
            background: rgba(232, 99, 107, 0.08);
            border-color: rgba(232, 99, 107, 0.1);
            color: #e8636b;
        }
        .acoes button.btn-fugir:hover:not(:disabled) {
            background: rgba(232, 99, 107, 0.15);
        }
        .acoes button .sub {
            font-size: 8px;
            opacity: 0.4;
            font-weight: 400;
            display: block;
            line-height: 1;
        }

        /* MENSAGEM */
        .mensagem {
            margin-top: 10px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            color: #8b92b0;
            min-height: 38px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-weight: 500;
        }
        .mensagem .destaque {
            color: #d4a54a;
            font-weight: 700;
        }
        .mensagem .sucesso {
            color: #4caf84;
            font-weight: 700;
        }
        .mensagem .erro {
            color: #e8636b;
            font-weight: 700;
        }
        .mensagem .automatico {
            font-size: 10px;
            opacity: 0.4;
            display: block;
            margin-top: 2px;
        }

        /* STATUS */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 10px;
            color: #4a4f6a;
            flex-wrap: wrap;
            gap: 4px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .status-bar .status-info .vez {
            color: #aab4d6;
            font-weight: 600;
        }
        .btn-voltar {
            display: inline-block;
            padding: 4px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: #6a6f8a;
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            transition: 0.25s;
            font-family: 'Inter', sans-serif;
        }
        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8e8f0;
        }

        @media (max-width: 750px) {
            .game-container {
                padding: 14px;
            }
            .header h1 {
                font-size: 18px;
            }
            .header .score-group {
                padding: 2px 12px;
                gap: 10px;
            }
            .header .score-group .dupla-a,
            .header .score-group .dupla-b {
                font-size: 16px;
            }
            .jogadores-grid {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .jogador-card {
                padding: 6px 10px;
            }
            .jogador-card .carta-mao {
                min-width: 26px;
                min-height: 32px;
                padding: 1px 4px;
            }
            .jogador-card .carta-mao .carta-valor {
                font-size: 11px;
            }
            .jogador-card .carta-mao .carta-naipe {
                font-size: 9px;
            }
            .carta-mesa {
                min-width: 44px;
                min-height: 60px;
                padding: 4px 6px 2px;
            }
            .carta-mesa .carta-valor {
                font-size: 18px;
            }
            .carta-mesa .carta-naipe {
                font-size: 15px;
            }
            .vira-area .vira-card {
                font-size: 18px;
                padding: 1px 10px;
                min-width: 32px;
            }
            .connection-area input {
                width: 80px;
                font-size: 14px;
                padding: 4px 10px;
            }
            .connection-area button {
                font-size: 11px;
                padding: 4px 12px;
            }
            .acoes button {
                font-size: 10px;
                padding: 4px 10px;
            }
            .mensagem {
                font-size: 11px;
                padding: 6px 12px;
            }
        }

        @media (max-width: 480px) {
            .jogadores-grid {
                grid-template-columns: 1fr;
            }
            .header .score-group .label-pts {
                display: none;
            }
            .vira-area {
                gap: 8px;
                padding: 4px 10px;
            }
            .cartas-mesa {
                gap: 8px;
            }
            .acoes button .sub {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="title-group">
                <span class="icon-symbol">♠</span>
                <h1>Truco Paulista</h1>
            </div>
            <div class="score-group">
                <div>
                    <div class="dupla-a" id="scoreA">0</div>
                    <div class="label-pts">Dupla A</div>
                </div>
                <span class="vs">×</span>
                <div>
                    <div class="dupla-b" id="scoreB">0</div>
                    <div class="label-pts">Dupla B</div>
                </div>
            </div>
        </div>

        <!-- ===== CONEXÃO P2P ===== -->
        <div class="connection-area" id="connectionArea">
            <button class="gold" id="btnCreate">Criar Sala</button>
            <span class="label">ou</span>
            <input type="text" id="roomInput" placeholder="Código" maxlength="5" />
            <button class="primary" id="btnJoin">Entrar</button>
            <span id="codeDisplay" class="code-display hidden">—</span>
        </div>

        <!-- ===== MESA ===== -->
        <div class="mesa" id="mesa">
            <div class="vira-area">
                <span class="label">Vira</span>
                <span class="vira-card" id="viraDisplay">—</span>
                <span class="manilha-info" id="manilhaInfo">Manilha: <strong>—</strong></span>
            </div>
            <div class="cartas-mesa" id="cartasMesa">
                <span class="empty-msg">Aguardando jogadas...</span>
            </div>
        </div>

        <!-- ===== JOGADORES ===== -->
        <div class="jogadores-grid" id="jogadoresGrid"></div>

        <!-- ===== AÇÕES ===== -->
        <div class="acoes" id="acoes">
            <button class="btn-truco" id="btnTruco" disabled>Truco</button>
            <button class="btn-truco" id="btnSeis" disabled>6 <span class="sub">após truco</span></button>
            <button class="btn-truco" id="btnNove" disabled>9 <span class="sub">após 6</span></button>
            <button class="btn-truco" id="btnDoze" disabled>12 <span class="sub">após 9</span></button>
            <button class="btn-fugir" id="btnFugir" disabled>Fugir</button>
            <button class="btn-aceitar" id="btnAceitar" disabled>Aceitar</button>
        </div>

        <!-- ===== MENSAGEM ===== -->
        <div class="mensagem" id="mensagem">Conecte-se a um amigo ou jogue contra bots.</div>

        <!-- ===== STATUS ===== -->
        <div class="status-bar">
            <span class="status-info" id="statusInfo">Aguardando...</span>
            <a href="index.html" class="btn-voltar">← Voltar</a>
        </div>

    </div>

    <script>
        // ================================================================
        //  TRUCO PAULISTA — P2P + BOTS INTELIGENTES
        // ================================================================

        // ================================================================
        //  1. CONSTANTES
        // ================================================================

        const NAIPES = ['♣', '♥', '♠', '♦'];
        const ORDEM = ['4', '5', '6', '7', 'Q', 'J', 'K', '1', '2', '3'];
        const VALORES = { '4': 0, '5': 1, '6': 2, '7': 3, 'Q': 4, 'J': 5, 'K': 6, '1': 7, '2': 8, '3': 9 };
        const FORCA_NAIPES = { '♣': 3, '♥': 2, '♠': 1, '♦': 0 };
        const NIPES_CORES = { '♣': 'preto', '♥': 'vermelho', '♠': 'preto', '♦': 'vermelho' };
        const NIVEIS_TRUCO = [3, 6, 9, 12];

        // ================================================================
        //  2. ESTADO
        // ================================================================

        let estado = {
            jogadores: [],
            baralho: [],
            vira: null,
            manilhas: [],
            cartasMesa: [],
            rodadasGanhas: { A: 0, B: 0 },
            pontos: { A: 0, B: 0 },
            valorMao: 1,
            trucoPedidoPor: null,
            trucoRespondido: false,
            maoAtiva: false,
            jogadorDaVez: 0,
            fase: 'aguardando', // aguardando | jogando | fim_mao | fim_jogo
            vencedorRodada: null,
            mãoDe11: false,
            indexEmbaralhador: 0,
            processando: false,
            meuIndex: null,
            isHost: false,
            conn: null,
            peer: null,
            bots: [],
        };

        // ================================================================
        //  3. FUNÇÕES DO BARALHO
        // ================================================================

        function criarBaralho() {
            const b = [];
            for (const n of NAIPES)
                for (const v of ORDEM) b.push(v + n);
            return b;
        }

        function embaralhar(b) {
            for (let i = b.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [b[i], b[j]] = [b[j], b[i]];
            }
            return b;
        }

        function getValor(c) { return VALORES[c[0]]; }

        function getNaipe(c) { return c[1]; }

        function isManilha(c, manilhas) { return manilhas.includes(c); }

        function getForca(c, manilhas) {
            const v = getValor(c);
            const n = getNaipe(c);
            return isManilha(c, manilhas) ? 10 + FORCA_NAIPES[n] : v;
        }

        function getManilhas(vira) {
            const idx = ORDEM.indexOf(vira[0]);
            const v = ORDEM[(idx + 1) % ORDEM.length];
            return NAIPES.map(n => v + n);
        }

        function getCor(c) { return NIPES_CORES[getNaipe(c)]; }

        function getValorDisplay(c) { return c[0]; }

        function getNaipeDisplay(c) { return c[1]; }

        // ================================================================
        //  4. RENDERIZAÇÃO DAS CARTAS
        // ================================================================

        function renderCarta(c, tamanho = 'grande') {
            const v = getValorDisplay(c);
            const n = getNaipeDisplay(c);
            const cor = getCor(c);
            const cls = cor === 'vermelho' ? 'carta-naipe-vermelho' : 'carta-naipe-preto';
            if (tamanho === 'grande') {
                return `<div class="carta-valor ${cls}">${v}</div><div class="carta-naipe ${cls}">${n}</div>`;
            }
            return `<span class="carta-valor ${cls}">${v}</span><span class="carta-naipe ${cls}">${n}</span>`;
        }

        function renderCartaMao(c) {
            const v = getValorDisplay(c);
            const n = getNaipeDisplay(c);
            const cor = getCor(c);
            const cls = cor === 'vermelho' ? 'naipe-vermelho' : 'naipe-preto';
            return `<span class="carta-valor ${cls}">${v}</span><span class="carta-naipe ${cls}">${n}</span>`;
        }

        function renderVira(c) {
            const v = getValorDisplay(c);
            const n = getNaipeDisplay(c);
            const cor = getCor(c);
            const cls = cor === 'vermelho' ? 'vira-vermelho' : 'vira-preto';
            return `<span class="${cls}">${v}${n}</span>`;
        }

        function renderManilha(c) {
            const v = getValorDisplay(c);
            const n = getNaipeDisplay(c);
            const cor = getCor(c);
            const cls = cor === 'vermelho' ? 'manilha-vermelho' : 'manilha-preto';
            return `<span class="manilha-carta ${cls}">${v}${n}</span>`;
        }

        // ================================================================
        //  5. INICIALIZAÇÃO
        // ================================================================

        function initJogadores() {
            return [
                { id: 'p1', nome: 'Você', dupla: 'A', cartas: [], pontos: 0, humano: true, ativo: true },
                { id: 'p2', nome: 'Oponente 1', dupla: 'B', cartas: [], pontos: 0, humano: false, ativo: true },
                { id: 'p3', nome: 'Parceiro', dupla: 'A', cartas: [], pontos: 0, humano: false, ativo: true },
                { id: 'p4', nome: 'Oponente 2', dupla: 'B', cartas: [], pontos: 0, humano: false, ativo: true },
            ];
        }

        function iniciarPartida() {
            estado.jogadores = initJogadores();
            estado.pontos = { A: 0, B: 0 };
            estado.indexEmbaralhador = 0;
            iniciarNovaMao();
        }

        function iniciarNovaMao() {
            if (estado.processando) return;
            estado.processando = true;

            const baralho = embaralhar(criarBaralho());

            for (const j of estado.jogadores) j.cartas = [];

            let idx = 0;
            for (let i = 0; i < 3; i++) {
                for (const j of estado.jogadores) {
                    j.cartas.push(baralho[idx++]);
                }
            }

            estado.vira = baralho[idx];
            estado.manilhas = getManilhas(estado.vira);

            estado.cartasMesa = [];
            estado.rodadasGanhas = { A: 0, B: 0 };
            estado.valorMao = 1;
            estado.trucoPedidoPor = null;
            estado.trucoRespondido = false;
            estado.maoAtiva = true;
            estado.vencedorRodada = null;
            estado.fase = 'jogando';
            estado.processando = false;

            estado.mãoDe11 = (estado.pontos.A >= 11 || estado.pontos.B >= 11);
            if (estado.mãoDe11) {
                estado.valorMao = 3;
                setMensagem('⚠️ <span class="destaque">Mão de 11!</span> Vale 3 pontos.');
            }

            estado.jogadorDaVez = (estado.indexEmbaralhador + 1) % 4;
            estado.indexEmbaralhador = (estado.indexEmbaralhador + 1) % 4;

            atualizarUI();
            atualizarAcoes();
            setMensagem(`Nova mão! <span class="destaque">${estado.jogadores[estado.jogadorDaVez].nome}</span> começa.`);

            setTimeout(() => {
                if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                    botJogar();
                }
            }, 500);
        }

        // ================================================================
        //  6. LÓGICA DO JOGO
        // ================================================================

        function jogarCarta(idxJogador, idxCarta) {
            if (estado.processando || estado.fase !== 'jogando') return;
            if (estado.jogadorDaVez !== idxJogador) return;
            if (!estado.maoAtiva) return;

            estado.processando = true;
            const j = estado.jogadores[idxJogador];
            const carta = j.cartas[idxCarta];

            estado.cartasMesa.push({ jogador: idxJogador, carta: carta });
            j.cartas.splice(idxCarta, 1);

            setMensagem(`<span class="destaque">${j.nome}</span> jogou <strong>${carta}</strong>`);
            atualizarUI();

            setTimeout(() => {
                if (estado.cartasMesa.length === 4) {
                    resolverRodada();
                } else {
                    proximoJogador();
                    atualizarUI();
                    estado.processando = false;
                    setTimeout(() => {
                        if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                            botJogar();
                        }
                    }, 300);
                }
            }, 600);
        }

        function proximoJogador() {
            let next = (estado.jogadorDaVez + 1) % 4;
            while (!estado.jogadores[next].ativo) next = (next + 1) % 4;
            estado.jogadorDaVez = next;
        }

        function resolverRodada() {
            const cartas = estado.cartasMesa;
            let maior = cartas[0];
            for (const c of cartas) {
                if (getForca(c.carta, estado.manilhas) > getForca(maior.carta, estado.manilhas)) {
                    maior = c;
                }
            }

            const dupla = estado.jogadores[maior.jogador].dupla;
            estado.rodadasGanhas[dupla]++;
            estado.vencedorRodada = maior.jogador;

            setMensagem(`🏆 <span class="destaque">${estado.jogadores[maior.jogador].nome}</span> ganhou a rodada!`);
            atualizarUI();

            setTimeout(() => {
                if (estado.rodadasGanhas.A >= 2 || estado.rodadasGanhas.B >= 2) {
                    finalizarMao(dupla);
                    estado.processando = false;
                    return;
                }

                estado.rodadaAtual++;
                estado.cartasMesa = [];
                estado.jogadorDaVez = maior.jogador;
                estado.vencedorRodada = null;
                estado.processando = false;
                atualizarUI();

                setTimeout(() => {
                    if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                        botJogar();
                    }
                }, 400);
            }, 900);
        }

        function finalizarMao(dupla) {
            estado.maoAtiva = false;
            estado.fase = 'fim_mao';
            const pontos = estado.valorMao;
            estado.pontos[dupla] += pontos;

            let msg = `🎉 <span class="sucesso">Dupla ${dupla}</span> venceu a mão! +${pontos} pontos.`;

            if (estado.pontos.A >= 12) {
                estado.fase = 'fim_jogo';
                msg = `🏆 <span class="sucesso">Dupla A venceu o jogo!</span>`;
                setMensagem(msg);
                atualizarUI();
                atualizarAcoes();
                return;
            }
            if (estado.pontos.B >= 12) {
                estado.fase = 'fim_jogo';
                msg = `🏆 <span class="sucesso">Dupla B venceu o jogo!</span>`;
                setMensagem(msg);
                atualizarUI();
                atualizarAcoes();
                return;
            }

            setMensagem(msg + ' <span class="automatico">🔄 Nova mão em 2 segundos...</span>');
            atualizarUI();
            atualizarAcoes();

            setTimeout(() => {
                if (estado.fase === 'fim_mao') iniciarNovaMao();
            }, 2000);
        }

        // ================================================================
        //  7. TRUCO
        // ================================================================

        function pedirTruco() {
            if (estado.fase !== 'jogando' || estado.trucoPedidoPor || estado.mãoDe11) return;
            const j = estado.jogadores[estado.jogadorDaVez];
            estado.trucoPedidoPor = j.dupla;
            estado.trucoRespondido = false;
            setMensagem(`⚡ <span class="destaque">${j.nome}</span> pediu TRUCO! (Vale ${estado.valorMao + 2})`);
            atualizarAcoes();
        }

        function aceitarTruco() {
            if (estado.fase !== 'jogando' || !estado.trucoPedidoPor) return;
            estado.valorMao += 2;
            estado.trucoPedidoPor = null;
            estado.trucoRespondido = true;
            setMensagem(`✅ Truco aceito! Mão vale <span class="destaque">${estado.valorMao}</span> pontos.`);
            atualizarAcoes();
            setTimeout(() => {
                if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) botJogar();
            }, 400);
        }

        function fugir() {
            if (estado.fase !== 'jogando' || !estado.trucoPedidoPor) return;
            const dupla = estado.trucoPedidoPor;
            const pts = Math.min(estado.valorMao, 3);
            estado.pontos[dupla] += pts;
            estado.maoAtiva = false;
            estado.fase = 'fim_mao';
            estado.trucoPedidoPor = null;
            setMensagem(`🏃 <span class="erro">Fugiu!</span> Dupla ${dupla} ganha ${pts} pontos.`);
            atualizarUI();
            atualizarAcoes();
            setTimeout(() => {
                if (estado.fase === 'fim_mao') iniciarNovaMao();
            }, 1500);
        }

        function pedirMais(nivel) {
            if (estado.fase !== 'jogando' || !estado.trucoPedidoPor) return;
            const j = estado.jogadores[estado.jogadorDaVez];
            if (j.dupla === estado.trucoPedidoPor) {
                setMensagem('❌ <span class="erro">Quem pediu não pode pedir mais!</span>');
                return;
            }
            const idxAtual = NIVEIS_TRUCO.indexOf(estado.valorMao);
            const idxNovo = NIVEIS_TRUCO.indexOf(nivel);
            if (idxNovo <= idxAtual) {
                setMensagem(`❌ <span class="erro">Só pode pedir ${nivel} depois de ${estado.valorMao}!</span>`);
                return;
            }
            estado.valorMao = nivel;
            estado.trucoPedidoPor = j.dupla;
            estado.trucoRespondido = false;
            setMensagem(`⚡ <span class="destaque">${j.nome}</span> pediu ${nivel}! (Vale ${nivel})`);
            atualizarAcoes();
        }

        // ================================================================
        //  8. BOTS INTELIGENTES
        // ================================================================

        function botJogar() {
            const idx = estado.jogadorDaVez;
            const j = estado.jogadores[idx];
            if (j.humano || estado.fase !== 'jogando' || !estado.maoAtiva || estado.processando) return;

            setTimeout(() => {
                if (estado.fase !== 'jogando' || !estado.maoAtiva || estado.processando) return;

                // Decisão de truco (só no início da mão)
                if (!estado.trucoPedidoPor && !estado.mãoDe11 && estado.cartasMesa.length === 0) {
                    const forca = avaliarMao(j);
                    if (forca > 24 && Math.random() < 0.3) {
                        pedirTruco();
                        return;
                    }
                }

                // Resposta ao truco
                if (estado.trucoPedidoPor && !estado.trucoRespondido) {
                    if (j.dupla !== estado.trucoPedidoPor) {
                        const forca = avaliarMao(j);
                        if (forca > 18) {
                            aceitarTruco();
                            return;
                        } else {
                            fugir();
                            return;
                        }
                    }
                }

                // Jogar carta
                const cartas = j.cartas;
                if (cartas.length === 0) return;
                let melhorIdx = 0,
                    melhorForca = -1;
                for (let i = 0; i < cartas.length; i++) {
                    const f = getForca(cartas[i], estado.manilhas);
                    if (f > melhorForca) { melhorForca = f;
                        melhorIdx = i; }
                }
                jogarCarta(idx, melhorIdx);
            }, 400 + Math.random() * 300);
        }

        function avaliarMao(j) {
            let total = 0;
            for (const c of j.cartas) total += getForca(c, estado.manilhas);
            return total;
        }

        // ================================================================
        //  9. UI
        // ================================================================

        function atualizarUI() {
            document.getElementById('scoreA').textContent = estado.pontos.A;
            document.getElementById('scoreB').textContent = estado.pontos.B;

            // Vira
            const vd = document.getElementById('viraDisplay');
            if (estado.vira) {
                vd.innerHTML = renderVira(estado.vira);
                vd.className = 'vira-card';
            } else {
                vd.textContent = '—';
                vd.className = 'vira-card';
            }

            // Manilha
            const mi = document.getElementById('manilhaInfo');
            if (estado.manilhas && estado.manilhas.length) {
                const v = estado.manilhas[0][0];
                const cartas = estado.manilhas.map(c => renderManilha(c)).join(' ');
                mi.innerHTML = `Manilha: <strong>${v}</strong> ${cartas}`;
            } else {
                mi.innerHTML = 'Manilha: <strong>—</strong>';
            }

            // Mesa
            const mesaDiv = document.getElementById('cartasMesa');
            if (estado.cartasMesa.length === 0) {
                mesaDiv.innerHTML = '<span class="empty-msg">Aguardando jogadas...</span>';
            } else {
                mesaDiv.innerHTML = estado.cartasMesa.map(c => {
                    const j = estado.jogadores[c.jogador];
                    const venceu = estado.vencedorRodada === c.jogador;
                    return `<div class="carta-mesa ${venceu ? 'vencedor' : ''}">
                                ${renderCarta(c.carta, 'grande')}
                                <span class="jogador-nome">${j.nome}</span>
                                ${venceu ? '<span class="badge-vencedor">Venceu</span>' : ''}
                            </div>`;
                }).join('');
            }

            // Jogadores
            const grid = document.getElementById('jogadoresGrid');
            grid.innerHTML = estado.jogadores.map((j, idx) => {
                const ativo = estado.jogadorDaVez === idx && estado.fase === 'jogando';
                const isBot = !j.humano;
                const isHumano = j.humano;

                let cartasHTML = '';
                if (isBot) {
                    cartasHTML = j.cartas.map(() => `<span class="carta-mao bot-card">◆</span>`).join('');
                } else {
                    cartasHTML = j.cartas.map((c, i) => {
                        const jogou = estado.cartasMesa.some(c => c.jogador === idx);
                        const clickavel = estado.jogadorDaVez === idx && estado.fase === 'jogando' && !jogou;
                        return `<span class="carta-mao ${clickavel ? 'clickavel' : ''} ${jogou ? 'jogada' : ''}" 
                                     onclick="${clickavel ? `jogarCarta(${idx}, ${i})` : ''}">
                                    ${renderCartaMao(c)}
                                </span>`;
                    }).join('');
                }

                const vez = ativo ? '<span class="indicador-vez"></span>' : '';
                const humanoBadge = isHumano ? '<span class="badge-humano">Você</span>' : '';

                return `<div class="jogador-card dupla-${j.dupla.toLowerCase()} ${ativo ? 'ativo' : ''}">
                            <div class="topo">
                                <span class="nome">${vez}${j.nome} ${humanoBadge}</span>
                                <span class="badge-dupla ${j.dupla.toLowerCase()}">Dupla ${j.dupla}</span>
                            </div>
                            <div class="cartas">${cartasHTML}</div>
                            <div class="pontos-info">Pontos: <strong>${j.pontos}</strong></div>
                        </div>`;
            }).join('');

            // Destaque mesa
            document.getElementById('mesa').className = `mesa${estado.trucoPedidoPor && !estado.trucoRespondido ? ' destaque' : ''}`;

            // Status
            const si = document.getElementById('statusInfo');
            if (estado.fase === 'fim_jogo') si.innerHTML = '🏆 Jogo finalizado';
            else if (estado.fase === 'jogando') {
                const n = estado.jogadores[estado.jogadorDaVez].nome;
                si.innerHTML = `Vez de: <span class="vez">${n}</span>`;
            } else if (estado.fase === 'fim_mao') si.innerHTML = 'Mão finalizada';
            else si.innerHTML = 'Aguardando...';
        }

        function atualizarAcoes() {
            const j = estado.jogadores[estado.jogadorDaVez];
            const isHumano = j && j.humano;
            const isJogando = estado.fase === 'jogando';
            const temTruco = estado.trucoPedidoPor !== null && !estado.trucoRespondido;
            const podeTrucar = isJogando && isHumano && !temTruco && !estado.mãoDe11 && !estado.processando;
            const podeResponder = isJogando && isHumano && temTruco && !estado.processando;

            document.getElementById('btnTruco').disabled = !podeTrucar;
            document.getElementById('btnSeis').disabled = !podeResponder;
            document.getElementById('btnNove').disabled = !podeResponder;
            document.getElementById('btnDoze').disabled = !podeResponder;
            document.getElementById('btnFugir').disabled = !podeResponder;
            document.getElementById('btnAceitar').disabled = !podeResponder;
        }

        function setMensagem(msg) {
            document.getElementById('mensagem').innerHTML = msg;
        }

        // ================================================================
        //  10. PEERJS — CONEXÃO P2P
        // ================================================================

        let peer = null;
        let conn = null;
        let roomId = null;
        let isHost = false;

        function gerarCodigo() {
            const l = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let c = '';
            for (let i = 0; i < 5; i++) c += l[Math.floor(Math.random() * 26)];
            return c;
        }

        function criarSala() {
            if (peer) peer.destroy();
            roomId = gerarCodigo();
            peer = new Peer(roomId);
            isHost = true;

            peer.on('open', () => {
                document.getElementById('codeDisplay').textContent = roomId;
                document.getElementById('codeDisplay').className = 'code-display';
                document.getElementById('btnCreate').disabled = true;
                document.getElementById('btnJoin').disabled = true;
                document.getElementById('roomInput').disabled = true;
                setMensagem(`📋 Código: <strong>${roomId}</strong> — compartilhe com seu amigo`);

                peer.on('connection', (incoming) => {
                    conn = incoming;
                    conn.on('open', () => {
                        setMensagem('✅ Conectado! Iniciando partida...');
                        document.getElementById('codeDisplay').className = 'code-display hidden';
                        iniciarPartida();
                    });
                    conn.on('data', receberDados);
                    conn.on('close', () => {
                        setMensagem('❌ Conexão perdida');
                        document.getElementById('btnCreate').disabled = false;
                        document.getElementById('btnJoin').disabled = false;
                        document.getElementById('roomInput').disabled = false;
                    });
                });
            });

            peer.on('error', (err) => {
                if (err.message.includes('ID is taken')) {
                    criarSala();
                } else {
                    setMensagem('❌ Erro: ' + err.message);
                    document.getElementById('btnCreate').disabled = false;
                }
            });
        }

        function entrarSala() {
            const code = document.getElementById('roomInput').value.trim().toUpperCase();
            if (code.length !== 5) {
                setMensagem('❌ Digite um código de 5 letras');
                return;
            }

            if (peer) peer.destroy();
            peer = new Peer();
            isHost = false;

            peer.on('open', () => {
                conn = peer.connect(code);
                document.getElementById('btnCreate').disabled = true;
                document.getElementById('btnJoin').disabled = true;
                document.getElementById('roomInput').disabled = true;
                setMensagem('🔄 Conectando...');

                conn.on('open', () => {
                    setMensagem('✅ Conectado! Iniciando partida...');
                    iniciarPartida();
                });
                conn.on('data', receberDados);
                conn.on('close', () => {
                    setMensagem('❌ Conexão perdida');
                    document.getElementById('btnCreate').disabled = false;
                    document.getElementById('btnJoin').disabled = false;
                    document.getElementById('roomInput').disabled = false;
                });
                conn.on('error', () => {
                    setMensagem('❌ Código inválido');
                    document.getElementById('btnCreate').disabled = false;
                    document.getElementById('btnJoin').disabled = false;
                    document.getElementById('roomInput').disabled = false;
                });
            });

            peer.on('error', () => {
                setMensagem('❌ Erro ao conectar');
                document.getElementById('btnCreate').disabled = false;
                document.getElementById('btnJoin').disabled = false;
                document.getElementById('roomInput').disabled = false;
            });
        }

        function receberDados(data) {
            // Sincroniza estado do jogo
            if (data.type === 'sync') {
                estado.cartasMesa = data.cartasMesa || [];
                estado.rodadasGanhas = data.rodadasGanhas || { A: 0, B: 0 };
                estado.pontos = data.pontos || { A: 0, B: 0 };
                estado.valorMao = data.valorMao || 1;
                estado.trucoPedidoPor = data.trucoPedidoPor || null;
                estado.trucoRespondido = data.trucoRespondido || false;
                estado.maoAtiva = data.maoAtiva || false;
                estado.jogadorDaVez = data.jogadorDaVez || 0;
                estado.fase = data.fase || 'aguardando';
                estado.vencedorRodada = data.vencedorRodada || null;
                estado.mãoDe11 = data.mãoDe11 || false;
                estado.vira = data.vira || null;
                estado.manilhas = data.manilhas || [];

                // Sincroniza cartas dos jogadores (só as do oponente)
                if (data.jogadores) {
                    for (let i = 0; i < estado.jogadores.length; i++) {
                        if (!estado.jogadores[i].humano) {
                            estado.jogadores[i].cartas = data.jogadores[i]?.cartas || [];
                            estado.jogadores[i].pontos = data.jogadores[i]?.pontos || 0;
                        }
                    }
                }

                atualizarUI();
                atualizarAcoes();

                // Se for a vez de um bot, ele joga
                setTimeout(() => {
                    if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                        botJogar();
                    }
                }, 300);
            }

            if (data.type === 'carta_jogada') {
                // O outro jogador jogou uma carta
                const idx = data.jogadorIndex;
                const carta = data.carta;
                estado.cartasMesa.push({ jogador: idx, carta: carta });
                // Remove a carta do jogador (se for o oponente)
                if (!estado.jogadores[idx].humano) {
                    const pos = estado.jogadores[idx].cartas.indexOf(carta);
                    if (pos > -1) estado.jogadores[idx].cartas.splice(pos, 1);
                }
                setMensagem(`<span class="destaque">${estado.jogadores[idx].nome}</span> jogou <strong>${carta}</strong>`);
                atualizarUI();
                atualizarAcoes();

                // Verifica se todos jogaram
                if (estado.cartasMesa.length === 4) {
                    resolverRodada();
                } else {
                    proximoJogador();
                    estado.processando = false;
                    atualizarUI();
                    setTimeout(() => {
                        if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                            botJogar();
                        }
                    }, 300);
                }
            }

            if (data.type === 'truco') {
                estado.trucoPedidoPor = data.dupla;
                estado.trucoRespondido = false;
                setMensagem(`⚡ <span class="destaque">${data.nome}</span> pediu TRUCO! (Vale ${estado.valorMao + 2})`);
                atualizarAcoes();
            }

            if (data.type === 'aceitar_truco') {
                estado.valorMao += 2;
                estado.trucoPedidoPor = null;
                estado.trucoRespondido = true;
                setMensagem(`✅ Truco aceito! Mão vale <span class="destaque">${estado.valorMao}</span> pontos.`);
                atualizarAcoes();
            }

            if (data.type === 'fugir_truco') {
                const dupla = data.dupla;
                const pts = Math.min(estado.valorMao, 3);
                estado.pontos[dupla] += pts;
                estado.maoAtiva = false;
                estado.fase = 'fim_mao';
                estado.trucoPedidoPor = null;
                setMensagem(`🏃 <span class="erro">Fugiu!</span> Dupla ${dupla} ganha ${pts} pontos.`);
                atualizarUI();
                atualizarAcoes();
                setTimeout(() => {
                    if (estado.fase === 'fim_mao') iniciarNovaMao();
                }, 1500);
            }

            if (data.type === 'pedir_mais') {
                estado.valorMao = data.nivel;
                estado.trucoPedidoPor = data.dupla;
                estado.trucoRespondido = false;
                setMensagem(`⚡ <span class="destaque">${data.nome}</span> pediu ${data.nivel}! (Vale ${data.nivel})`);
                atualizarAcoes();
            }
        }

        function enviarDados(tipo, dados) {
            if (conn && conn.open) {
                conn.send({ type: tipo, ...dados });
            }
        }

        // ================================================================
        //  11. BOTÕES E INICIALIZAÇÃO
        // ================================================================

        document.getElementById('btnCreate').addEventListener('click', criarSala);
        document.getElementById('btnJoin').addEventListener('click', entrarSala);
        document.getElementById('roomInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') entrarSala();
            setTimeout(() => {
                document.getElementById('roomInput').value = document.getElementById('roomInput').value.toUpperCase();
            }, 10);
        });
        document.getElementById('roomInput').addEventListener('input', function() {
            if (this.value.length > 5) this.value = this.value.slice(0, 5);
            this.value = this.value.toUpperCase();
        });

        document.getElementById('btnTruco').addEventListener('click', () => {
            pedirTruco();
            if (conn) enviarDados('truco', { dupla: estado.jogadores[estado.jogadorDaVez].dupla, nome: estado.jogadores[
                    estado.jogadorDaVez].nome });
        });
        document.getElementById('btnAceitar').addEventListener('click', () => {
            aceitarTruco();
            if (conn) enviarDados('aceitar_truco', {});
        });
        document.getElementById('btnFugir').addEventListener('click', () => {
            fugir();
            if (conn) enviarDados('fugir_truco', { dupla: estado.trucoPedidoPor });
        });
        document.getElementById('btnSeis').addEventListener('click', () => {
            pedirMais(6);
            if (conn) enviarDados('pedir_mais', { nivel: 6, dupla: estado.jogadores[estado.jogadorDaVez].dupla, nome: estado
                    .jogadores[estado.jogadorDaVez].nome });
        });
        document.getElementById('btnNove').addEventListener('click', () => {
            pedirMais(9);
            if (conn) enviarDados('pedir_mais', { nivel: 9, dupla: estado.jogadores[estado.jogadorDaVez].dupla, nome: estado
                    .jogadores[estado.jogadorDaVez].nome });
        });
        document.getElementById('btnDoze').addEventListener('click', () => {
            pedirMais(12);
            if (conn) enviarDados('pedir_mais', { nivel: 12, dupla: estado.jogadores[estado.jogadorDaVez].dupla, nome: estado
                    .jogadores[estado.jogadorDaVez].nome });
        });

        // Sobrescreve funções para enviar dados via P2P
        const originalJogarCarta = jogarCarta;
        jogarCarta = function(idxJogador, idxCarta) {
            if (estado.processando || estado.fase !== 'jogando') return;
            if (estado.jogadorDaVez !== idxJogador) return;
            if (!estado.maoAtiva) return;

            const j = estado.jogadores[idxJogador];
            const carta = j.cartas[idxCarta];

            // Envia para o outro jogador
            if (conn && conn.open) {
                enviarDados('carta_jogada', { jogadorIndex: idxJogador, carta: carta });
            }

            // Executa localmente
            estado.processando = true;
            estado.cartasMesa.push({ jogador: idxJogador, carta: carta });
            j.cartas.splice(idxCarta, 1);

            setMensagem(`<span class="destaque">${j.nome}</span> jogou <strong>${carta}</strong>`);
            atualizarUI();

            setTimeout(() => {
                if (estado.cartasMesa.length === 4) {
                    resolverRodada();
                } else {
                    proximoJogador();
                    atualizarUI();
                    estado.processando = false;
                    setTimeout(() => {
                        if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                            botJogar();
                        }
                    }, 300);
                }
            }, 600);
        };

        // Sobrescreve finalizarMao para sincronizar
        const originalFinalizarMao = finalizarMao;
        finalizarMao = function(dupla) {
            estado.maoAtiva = false;
            estado.fase = 'fim_mao';
            const pontos = estado.valorMao;
            estado.pontos[dupla] += pontos;

            let msg = `🎉 <span class="sucesso">Dupla ${dupla}</span> venceu a mão! +${pontos} pontos.`;

            if (estado.pontos.A >= 12) {
                estado.fase = 'fim_jogo';
                msg = `🏆 <span class="sucesso">Dupla A venceu o jogo!</span>`;
                setMensagem(msg);
                atualizarUI();
                atualizarAcoes();
                // Sincroniza
                if (conn) enviarDados('sync', { fase: 'fim_jogo', pontos: estado.pontos });
                return;
            }
            if (estado.pontos.B >= 12) {
                estado.fase = 'fim_jogo';
                msg = `🏆 <span class="sucesso">Dupla B venceu o jogo!</span>`;
                setMensagem(msg);
                atualizarUI();
                atualizarAcoes();
                if (conn) enviarDados('sync', { fase: 'fim_jogo', pontos: estado.pontos });
                return;
            }

            setMensagem(msg + ' <span class="automatico">🔄 Nova mão em 2 segundos...</span>');
            atualizarUI();
            atualizarAcoes();

            // Sincroniza
            if (conn) enviarDados('sync', {
                pontos: estado.pontos,
                fase: 'fim_mao',
                cartasMesa: estado.cartasMesa,
                rodadasGanhas: estado.rodadasGanhas
            });

            setTimeout(() => {
                if (estado.fase === 'fim_mao') iniciarNovaMao();
            }, 2000);
        };

        // Sobrescreve iniciarNovaMao para sincronizar
        const originalIniciarNovaMao = iniciarNovaMao;
        iniciarNovaMao = function() {
            if (estado.processando) return;
            estado.processando = true;

            const baralho = embaralhar(criarBaralho());

            for (const j of estado.jogadores) j.cartas = [];

            let idx = 0;
            for (let i = 0; i < 3; i++) {
                for (const j of estado.jogadores) {
                    j.cartas.push(baralho[idx++]);
                }
            }

            estado.vira = baralho[idx];
            estado.manilhas = getManilhas(estado.vira);

            estado.cartasMesa = [];
            estado.rodadasGanhas = { A: 0, B: 0 };
            estado.valorMao = 1;
            estado.trucoPedidoPor = null;
            estado.trucoRespondido = false;
            estado.maoAtiva = true;
            estado.vencedorRodada = null;
            estado.fase = 'jogando';
            estado.processando = false;

            estado.mãoDe11 = (estado.pontos.A >= 11 || estado.pontos.B >= 11);
            if (estado.mãoDe11) {
                estado.valorMao = 3;
                setMensagem('⚠️ <span class="destaque">Mão de 11!</span> Vale 3 pontos.');
            }

            estado.jogadorDaVez = (estado.indexEmbaralhador + 1) % 4;
            estado.indexEmbaralhador = (estado.indexEmbaralhador + 1) % 4;

            // Sincroniza com o outro jogador
            if (conn && conn.open) {
                enviarDados('sync', {
                    jogadores: estado.jogadores.map(j => ({ cartas: j.cartas, pontos: j.pontos })),
                    vira: estado.vira,
                    manilhas: estado.manilhas,
                    pontos: estado.pontos,
                    valorMao: estado.valorMao,
                    jogadorDaVez: estado.jogadorDaVez,
                    mãoDe11: estado.mãoDe11,
                    fase: estado.fase
                });
            }

            atualizarUI();
            atualizarAcoes();
            setMensagem(`Nova mão! <span class="destaque">${estado.jogadores[estado.jogadorDaVez].nome}</span> começa.`);

            setTimeout(() => {
                if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                    botJogar();
                }
            }, 500);
        };

        // ================================================================
        //  12. INÍCIO
        // ================================================================

        setMensagem('Conecte-se a um amigo ou jogue contra bots.');
        estado.jogadores = initJogadores();
        atualizarUI();

        console.log('🃏 Truco Paulista — P2P + Bots Inteligentes');
        console.log('📌 Crie uma sala ou entre com o código de 5 letras');
        console.log('🤖 Bots: Oponente 1, Parceiro, Oponente 2');

        // EXPORTAR FUNÇÕES
        window.jogarCarta = jogarCarta;
        window.pedirTruco = pedirTruco;
        window.aceitarTruco = aceitarTruco;
        window.fugir = fugir;
        window.pedirMais = pedirMais;
        window.iniciarNovaMao = iniciarNovaMao;
        window.criarSala = criarSala;
        window.entrarSala = entrarSala;
    </script>

</body>
</html>
