<script>
    // ================================================================
    //  TRUCO PAULISTA — CÓDIGO COMPLETO (CORRIGIDO)
    // ================================================================

    // ================================================================
    //  1. CONSTANTES E CONFIGURAÇÕES
    // ================================================================

    const NAIPES = ['♣', '♥', '♠', '♦'];
    const ORDEM = ['4', '5', '6', '7', 'Q', 'J', 'K', '1', '2', '3'];
    const VALORES = { '4': 0, '5': 1, '6': 2, '7': 3, 'Q': 4, 'J': 5, 'K': 6, '1': 7, '2': 8, '3': 9 };
    const FORCA_NAIPES = { '♣': 3, '♥': 2, '♠': 1, '♦': 0 };

    // ================================================================
    //  2. ESTADO DO JOGO
    // ================================================================

    let estado = {
        baralho: [],
        vira: null,
        manilhas: [],
        jogadores: [],
        cartasMesa: [],
        rodadaAtual: 0,
        rodadasGanhas: { A: 0, B: 0 },
        pontos: { A: 0, B: 0 },
        valorMao: 1,
        trucoNivel: 1,
        trucoPedidoPor: null,
        trucoRespondido: false,
        maoAtiva: false,
        jogadorDaVez: 0,
        fase: 'aguardando',
        vencedorMao: null,
        mãoDe11: false,
        mãoDeFerro: false,
        indexEmbaralhador: 0,
        codigo: '',
    };

    // ================================================================
    //  3. FUNÇÕES DO BARALHO
    // ================================================================

    function criarBaralho() {
        const baralho = [];
        for (const naipe of NAIPES) {
            for (const valor of ORDEM) {
                baralho.push(valor + naipe);
            }
        }
        return baralho;
    }

    function embaralhar(baralho) {
        for (let i = baralho.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [baralho[i], baralho[j]] = [baralho[j], baralho[i]];
        }
        return baralho;
    }

    function getValor(carta) {
        return VALORES[carta[0]];
    }

    function getNaipe(carta) {
        return carta[1];
    }

    function isManilha(carta, manilhas) {
        return manilhas.includes(carta);
    }

    function getForca(carta, manilhas) {
        const valor = getValor(carta);
        const naipe = getNaipe(carta);

        if (isManilha(carta, manilhas)) {
            return 10 + FORCA_NAIPES[naipe];
        }
        return valor;
    }

    function getManilhas(vira) {
        const index = ORDEM.indexOf(vira[0]);
        const manilhaValor = ORDEM[(index + 1) % ORDEM.length];
        return NAIPES.map(n => manilhaValor + n);
    }

    // ================================================================
    //  4. INICIALIZAÇÃO
    // ================================================================

    function initJogadores() {
        return [
            { id: 'p1', nome: 'Você', dupla: 'A', cartas: [], pontos: 0, humano: true, ativo: true },
            { id: 'p2', nome: 'Bot 1', dupla: 'B', cartas: [], pontos: 0, humano: false, ativo: true },
            { id: 'p3', nome: 'Bot 2', dupla: 'A', cartas: [], pontos: 0, humano: false, ativo: true },
            { id: 'p4', nome: 'Bot 3', dupla: 'B', cartas: [], pontos: 0, humano: false, ativo: true },
        ];
    }

    function iniciarNovaMao() {
        const baralho = embaralhar(criarBaralho());

        // Reseta jogadores (mantém pontos)
        for (const j of estado.jogadores) {
            j.cartas = [];
        }

        // Distribui 3 cartas para cada jogador
        let idx = 0;
        for (let i = 0; i < 3; i++) {
            for (const j of estado.jogadores) {
                j.cartas.push(baralho[idx++]);
            }
        }

        // Vira
        const vira = baralho[idx];
        estado.vira = vira;
        estado.manilhas = getManilhas(vira);

        // Reseta estado da mão
        estado.cartasMesa = [];
        estado.rodadaAtual = 0;
        estado.rodadasGanhas = { A: 0, B: 0 };
        estado.valorMao = 1;
        estado.trucoNivel = 1;
        estado.trucoPedidoPor = null;
        estado.trucoRespondido = false;
        estado.maoAtiva = true;
        estado.vencedorMao = null;
        estado.fase = 'jogando';

        // Verifica mão de 11
        estado.mãoDe11 = (estado.pontos.A >= 11 || estado.pontos.B >= 11);
        estado.mãoDeFerro = (estado.pontos.A >= 11 && estado.pontos.B >= 11);

        if (estado.mãoDe11) {
            estado.valorMao = 3;
            estado.trucoNivel = 3;
            setMensagem('⚠️ <span class="destaque">Mão de 11!</span> Vale 3 pontos automaticamente.', '');
        }

        if (estado.mãoDeFerro) {
            setMensagem('🔥 <span class="destaque">Mão de Ferro!</span> Jogar no escuro!', '');
        }

        // Quem começa (próximo ao embaralhador)
        estado.jogadorDaVez = (estado.indexEmbaralhador + 1) % 4;
        estado.indexEmbaralhador = (estado.indexEmbaralhador + 1) % 4;

        atualizarUI();
        atualizarAcoes();

        const nome = estado.jogadores[estado.jogadorDaVez].nome;
        setMensagem(`🃏 Nova mão! <span class="destaque">${nome}</span> começa.`, '');

        // Se o primeiro for bot, joga automaticamente
        setTimeout(() => {
            if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                botJogar();
            }
        }, 500);
    }

    // ================================================================
    //  5. LÓGICA DO JOGO
    // ================================================================

    function jogarCarta(jogadorIndex, cartaIndex) {
        if (estado.fase !== 'jogando') return;
        if (estado.jogadorDaVez !== jogadorIndex) return;
        if (!estado.maoAtiva) return;

        const jogador = estado.jogadores[jogadorIndex];
        const carta = jogador.cartas[cartaIndex];

        estado.cartasMesa.push({ jogador: jogadorIndex, carta: carta });
        jogador.cartas.splice(cartaIndex, 1);

        proximoJogador();

        if (estado.cartasMesa.length === 4) {
            resolverRodada();
        }

        atualizarUI();
        atualizarAcoes();

        // Se o próximo for bot, ele joga
        setTimeout(() => {
            if (estado.fase === 'jogando' && estado.cartasMesa.length < 4) {
                const next = estado.jogadores[estado.jogadorDaVez];
                if (!next.humano) {
                    botJogar();
                }
            }
        }, 300);
    }

    function proximoJogador() {
        let next = (estado.jogadorDaVez + 1) % 4;
        while (!estado.jogadores[next].ativo) {
            next = (next + 1) % 4;
        }
        estado.jogadorDaVez = next;
    }

    function resolverRodada() {
        const cartas = estado.cartasMesa;
        const manilhas = estado.manilhas;

        const ordenadas = cartas.map(c => ({
            ...c,
            forca: getForca(c.carta, manilhas)
        }));

        let maior = ordenadas[0];
        for (const c of ordenadas) {
            if (c.forca > maior.forca) {
                maior = c;
            }
        }

        const duplaVencedora = estado.jogadores[maior.jogador].dupla;
        estado.rodadasGanhas[duplaVencedora]++;

        const nomeVencedor = estado.jogadores[maior.jogador].nome;
        setMensagem(`🏆 <span class="destaque">${nomeVencedor}</span> ganhou a rodada!`, '');

        if (estado.rodadasGanhas.A >= 2 || estado.rodadasGanhas.B >= 2) {
            finalizarMao(duplaVencedora);
            return;
        }

        estado.rodadaAtual++;
        estado.cartasMesa = [];
        estado.jogadorDaVez = maior.jogador;

        atualizarUI();
        atualizarAcoes();

        // Se o próximo for bot
        setTimeout(() => {
            if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                botJogar();
            }
        }, 500);
    }

    function finalizarMao(duplaVencedora) {
        estado.maoAtiva = false;
        estado.fase = 'fim_mao';
        estado.vencedorMao = duplaVencedora;

        const pontos = estado.valorMao;
        estado.pontos[duplaVencedora] += pontos;

        setMensagem(`🎉 <span class="sucesso">Dupla ${duplaVencedora}</span> venceu a mão! +${pontos} pontos.`, '');

        if (estado.pontos.A >= 12) {
            setMensagem('🏆 <span class="sucesso">Dupla A venceu o jogo!</span> Parabéns!', '');
            estado.fase = 'fim_jogo';
        } else if (estado.pontos.B >= 12) {
            setMensagem('🏆 <span class="sucesso">Dupla B venceu o jogo!</span> Parabéns!', '');
            estado.fase = 'fim_jogo';
        }

        atualizarUI();
        atualizarAcoes();
    }

    // ================================================================
    //  6. TRUCO
    // ================================================================

    function pedirTruco() {
        if (estado.fase !== 'jogando') return;
        if (estado.trucoPedidoPor) return;
        if (estado.mãoDe11) {
            setMensagem('❌ <span class="erro">Não pode pedir truco na mão de 11!</span>', '');
            return;
        }

        const jogador = estado.jogadores[estado.jogadorDaVez];
        estado.trucoPedidoPor = jogador.dupla;
        estado.trucoRespondido = false;

        setMensagem(`⚡ <span class="destaque">${jogador.nome}</span> pediu TRUCO! (Vale ${estado.valorMao + 2})`, '');
        atualizarAcoes();
    }

    function aceitarTruco() {
        if (estado.fase !== 'jogando') return;
        if (!estado.trucoPedidoPor) return;

        estado.valorMao += 2;
        estado.trucoNivel = estado.valorMao;
        estado.trucoPedidoPor = null;
        estado.trucoRespondido = true;

        setMensagem(`✅ Truco aceito! Mão vale <span class="destaque">${estado.valorMao}</span> pontos.`, '');
        atualizarAcoes();

        // Próximo jogador (se for bot)
        setTimeout(() => {
            if (estado.fase === 'jogando' && !estado.jogadores[estado.jogadorDaVez].humano) {
                botJogar();
            }
        }, 500);
    }

    function fugir() {
        if (estado.fase !== 'jogando') return;
        if (!estado.trucoPedidoPor) return;

        const duplaQuePediu = estado.trucoPedidoPor;
        const pontos = Math.min(estado.valorMao, 3);

        estado.pontos[duplaQuePediu] += pontos;
        estado.maoAtiva = false;
        estado.fase = 'fim_mao';

        setMensagem(`🏃‍♂️ <span class="erro">Fugiu!</span> Dupla ${duplaQuePediu} ganha ${pontos} pontos.`, '');
        estado.trucoPedidoPor = null;

        if (estado.pontos.A >= 12 || estado.pontos.B >= 12) {
            estado.fase = 'fim_jogo';
            setMensagem(`🏆 <span class="sucesso">Dupla ${duplaQuePediu} venceu o jogo!</span>`, '');
        }

        atualizarUI();
        atualizarAcoes();
    }

    function pedirMais(nivel) {
        if (estado.fase !== 'jogando') return;
        if (!estado.trucoPedidoPor) return;

        const jogador = estado.jogadores[estado.jogadorDaVez];
        const duplaAtual = jogador.dupla;
        const duplaQuePediu = estado.trucoPedidoPor;

        if (duplaAtual === duplaQuePediu) {
            setMensagem('❌ <span class="erro">Quem pediu não pode pedir mais!</span>', '');
            return;
        }

        const niveis = [3, 6, 9, 12];
        const indexAtual = niveis.indexOf(estado.valorMao);
        const indexNovo = niveis.indexOf(nivel);

        if (indexNovo <= indexAtual) {
            setMensagem(`❌ <span class="erro">Só pode pedir ${nivel} depois de ${estado.valorMao}!</span>`, '');
            return;
        }

        estado.valorMao = nivel;
        estado.trucoNivel = nivel;
        estado.trucoPedidoPor = duplaAtual;
        estado.trucoRespondido = false;

        setMensagem(`⚡ <span class="destaque">${jogador.nome}</span> pediu ${nivel}! (Vale ${nivel})`, '');
        atualizarAcoes();
    }

    // ================================================================
    //  7. BOTS
    // ================================================================

    function botJogar() {
        const jogadorIndex = estado.jogadorDaVez;
        const jogador = estado.jogadores[jogadorIndex];

        if (!jogador.humano && estado.fase === 'jogando' && estado.maoAtiva) {
            setTimeout(() => {
                if (estado.fase !== 'jogando' || !estado.maoAtiva) return;

                // Avalia truco
                if (!estado.trucoPedidoPor && !estado.mãoDe11 && estado.cartasMesa.length === 0) {
                    const forca = avaliarMao(jogador);
                    if (forca > 22 && Math.random() < 0.25) {
                        pedirTruco();
                        setTimeout(() => {
                            if (estado.trucoPedidoPor && !estado.trucoRespondido) {
                                // Se o bot pediu truco, o humano responde
                            }
                        }, 300);
                        return;
                    }
                }

                // Responde truco
                if (estado.trucoPedidoPor && !estado.trucoRespondido) {
                    const duplaBot = jogador.dupla;
                    if (duplaBot !== estado.trucoPedidoPor) {
                        const forca = avaliarMao(jogador);
                        if (forca > 16) {
                            aceitarTruco();
                        } else {
                            fugir();
                        }
                        return;
                    }
                }

                // Joga carta
                const cartas = jogador.cartas;
                if (cartas.length === 0) return;

                let melhorIndex = 0;
                let melhorForca = -1;
                for (let i = 0; i < cartas.length; i++) {
                    const forca = getForca(cartas[i], estado.manilhas);
                    if (forca > melhorForca) {
                        melhorForca = forca;
                        melhorIndex = i;
                    }
                }

                jogarCarta(jogadorIndex, melhorIndex);
            }, 500 + Math.random() * 400);
        }
    }

    function avaliarMao(jogador) {
        let forcaTotal = 0;
        for (const carta of jogador.cartas) {
            forcaTotal += getForca(carta, estado.manilhas);
        }
        return forcaTotal;
    }

    // ================================================================
    //  8. UI
    // ================================================================

    function atualizarUI() {
        document.getElementById('scoreA').textContent = estado.pontos.A;
        document.getElementById('scoreB').textContent = estado.pontos.B;

        const viraDisplay = document.getElementById('viraDisplay');
        if (estado.vira) {
            viraDisplay.textContent = estado.vira;
            const manilhaValor = estado.manilhas[0][0];
            document.getElementById('manilhaInfo').textContent = `Manilha: ${manilhaValor} ♣♥♠♦`;
        } else {
            viraDisplay.textContent = '—';
            document.getElementById('manilhaInfo').textContent = 'Manilha: —';
        }

        const mesaDiv = document.getElementById('cartasMesa');
        if (estado.cartasMesa.length === 0) {
            mesaDiv.innerHTML = '<span style="color:#3a3f55; font-size:13px;">Aguardando jogadas...</span>';
        } else {
            mesaDiv.innerHTML = estado.cartasMesa.map(c => {
                const jogador = estado.jogadores[c.jogador];
                return `<div class="carta-mesa">
                            ${c.carta}
                            <span class="jogador-nome">${jogador.nome}</span>
                        </div>`;
            }).join('');
        }

        const grid = document.getElementById('jogadoresGrid');
        grid.innerHTML = estado.jogadores.map((j, index) => {
            const isAtivo = estado.jogadorDaVez === index && estado.fase === 'jogando';
            const isHumano = j.humano;
            const isBot = !j.humano;

            let cartasHTML = '';
            if (isBot) {
                cartasHTML = j.cartas.map(() =>
                    `<span class="carta-mao bot-card">🂠</span>`
                ).join('');
            } else {
                cartasHTML = j.cartas.map((c, i) => {
                    const jaJogou = estado.cartasMesa.some(c => c.jogador === index);
                    return `<span class="carta-mao ${jaJogou ? 'jogada' : ''}" 
                                 onclick="if(!${jaJogou}) jogarCarta(${index}, ${i})">
                                    ${c}
                                </span>`;
                }).join('');
            }

            return `
                        <div class="jogador-card dupla-${j.dupla.toLowerCase()} ${isAtivo ? 'ativo' : ''} ${isBot ? 'bot' : 'humano'}">
                            <div class="topo">
                                <span class="nome">${isBot ? '🤖 ' : '🎮 '}${j.nome}</span>
                                <span class="badge-dupla ${j.dupla.toLowerCase()}">Dupla ${j.dupla}</span>
                            </div>
                            <div class="cartas">${cartasHTML}</div>
                            <div style="font-size:11px;color:#4a4f6a;margin-top:4px;">${j.pontos} pts</div>
                        </div>
                    `;
        }).join('');

        const statusInfo = document.getElementById('statusInfo');
        if (estado.fase === 'fim_jogo') {
            statusInfo.textContent = '🏆 Jogo finalizado!';
        } else if (estado.fase === 'jogando') {
            const nome = estado.jogadores[estado.jogadorDaVez].nome;
            statusInfo.textContent = `Vez de: ${nome}`;
        } else if (estado.fase === 'fim_mao') {
            statusInfo.textContent = `Mão finalizada!`;
        } else {
            statusInfo.textContent = 'Aguardando...';
        }
    }

    function atualizarAcoes() {
        const btnTruco = document.getElementById('btnTruco');
        const btnSeis = document.getElementById('btnSeis');
        const btnNove = document.getElementById('btnNove');
        const btnDoze = document.getElementById('btnDoze');
        const btnFugir = document.getElementById('btnFugir');
        const btnAceitar = document.getElementById('btnAceitar');
        const btnNovaMao = document.getElementById('btnNovaMao');

        const isJogando = estado.fase === 'jogando';
        const isHumano = estado.jogadores[estado.jogadorDaVez]?.humano || false;
        const temTruco = estado.trucoPedidoPor !== null && !estado.trucoRespondido;

        btnTruco.disabled = !(isJogando && isHumano && !temTruco && !estado.mãoDe11);
        btnSeis.disabled = !(isJogando && isHumano && temTruco);
        btnNove.disabled = !(isJogando && isHumano && temTruco);
        btnDoze.disabled = !(isJogando && isHumano && temTruco);
        btnFugir.disabled = !(isJogando && isHumano && temTruco);
        btnAceitar.disabled = !(isJogando && isHumano && temTruco);

        // NOVA MÃO: só desabilita se estiver jogando
        btnNovaMao.disabled = (estado.fase === 'jogando');
    }

    function setMensagem(msg) {
        document.getElementById('mensagem').innerHTML = msg;
    }

    // ================================================================
    //  9. BOTÕES
    // ================================================================

    document.getElementById('btnTruco').addEventListener('click', pedirTruco);
    document.getElementById('btnSeis').addEventListener('click', () => pedirMais(6));
    document.getElementById('btnNove').addEventListener('click', () => pedirMais(9));
    document.getElementById('btnDoze').addEventListener('click', () => pedirMais(12));
    document.getElementById('btnFugir').addEventListener('click', fugir);
    document.getElementById('btnAceitar').addEventListener('click', aceitarTruco);
    document.getElementById('btnNovaMao').addEventListener('click', () => {
        if (estado.fase === 'fim_jogo') {
            estado.pontos = { A: 0, B: 0 };
            estado.jogadores = initJogadores();
            estado.indexEmbaralhador = 0;
        }
        iniciarNovaMao();
    });

    // ================================================================
    //  10. INICIALIZAÇÃO
    // ================================================================

    function gerarCodigo() {
        const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        let codigo = '';
        for (let i = 0; i < 5; i++) {
            codigo += letras.charAt(Math.floor(Math.random() * letras.length));
        }
        return codigo;
    }

    estado.jogadores = initJogadores();
    estado.codigo = gerarCodigo();
    document.getElementById('codigoDisplay').textContent = estado.codigo;

    setMensagem('🃏 Bem-vindo ao Truco Paulista! Clique em <span class="destaque">"Nova Mão"</span> para começar.');
    atualizarUI();
    atualizarAcoes();

    // Habilita o botão "Nova Mão" no início
    document.getElementById('btnNovaMao').disabled = false;

    console.log('🃏 Truco Paulista carregado!');
    console.log('📌 Clique em "Nova Mão" para começar.');

    // ================================================================
    //  11. EXPORTAR FUNÇÕES
    // ================================================================

    window.jogarCarta = jogarCarta;
    window.pedirTruco = pedirTruco;
    window.aceitarTruco = aceitarTruco;
    window.fugir = fugir;
    window.pedirMais = pedirMais;
    window.iniciarNovaMao = iniciarNovaMao;
</script>
