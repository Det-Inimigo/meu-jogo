<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ping Pong — PlayHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #0b0b12;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(30, 60, 114, 0.10) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(114, 60, 30, 0.06) 0%, transparent 60%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #e8e8f0;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 32px 32px 26px;
            max-width: 760px;
            width: 100%;
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-header .title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .game-header .title-group svg {
            width: 28px;
            height: 28px;
        }

        .game-header h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #e8e8f0;
        }

        .game-header .score {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #aab4d6;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .game-header .score span {
            color: #d4a54a;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            aspect-ratio: 700 / 450;
            background: #11111e;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            font-size: 13px;
            color: #5a5f7a;
            flex-wrap: wrap;
            gap: 8px;
        }

        .controls .key-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls .key {
            display: inline-block;
            padding: 2px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #8b92b0;
            font-family: inherit;
        }

        .controls .key.blue {
            color: #6b8af5;
            border-color: rgba(91, 124, 250, 0.15);
        }

        .controls .key.gold {
            color: #d4a54a;
            border-color: rgba(212, 165, 74, 0.15);
        }

        .controls .p1-label {
            color: #6b8af5;
        }
        .controls .p2-label {
            color: #d4a54a;
        }

        .btn-back {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 28px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            color: #6a6f8a;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #e8e8f0;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .btn-back svg {
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 16px;
            }
            .game-header h2 {
                font-size: 18px;
            }
            .game-header .score {
                font-size: 20px;
                padding: 0 12px;
            }
            .controls {
                font-size: 11px;
            }
            .controls .key {
                font-size: 10px;
                padding: 1px 8px;
            }
            .btn-back {
                font-size: 12px;
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- HEADER -->
        <div class="game-header">
            <div class="title-group">
                <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="8" width="3" height="14" rx="1.5" stroke="#6b8af5" stroke-width="2"/>
                    <rect x="23" y="8" width="3" height="14" rx="1.5" stroke="#d4a54a" stroke-width="2"/>
                    <circle cx="14" cy="14" r="5" stroke="white" stroke-width="1.5" opacity="0.3"/>
                    <circle cx="14" cy="14" r="3" stroke="white" stroke-width="1.2" opacity="0.15"/>
                </svg>
                <h2>Ping Pong</h2>
            </div>
            <div class="score" id="scoreDisplay">0 <span>·</span> 0</div>
        </div>

        <!-- CANVAS -->
        <canvas id="game" width="700" height="450"></canvas>

        <!-- CONTROLES -->
        <div class="controls">
            <span class="key-group">
                <span class="p1-label">Jogador 1</span>
                <span class="key blue">W</span>
                <span class="key blue">S</span>
            </span>
            <span style="color:#3a3f55; font-size:11px; letter-spacing:0.04em;">um teclado · dois jogadores</span>
            <span class="key-group">
                <span class="p2-label">Jogador 2</span>
                <span class="key gold">↑</span>
                <span class="key gold">↓</span>
            </span>
        </div>

        <!-- VOLTAR -->
        <a href="index.html" class="btn-back">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="8" x2="4" y2="8"/>
                <polyline points="8 12 4 8 8 4"/>
            </svg>
            Voltar ao hub
        </a>

    </div>

    <script>
        // ============================================================
        //  PING PONG — CÓDIGO DO JOGO
        // ============================================================

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');

        const W = 700,
            H = 450;
        const PADDLE_W = 10,
            PADDLE_H = 84;
        const BALL_R = 7;
        const SPEED = 4.5;

        const p1 = { x: 18, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0, score: 0 };
        const p2 = { x: W - 18 - PADDLE_W, y: H / 2 - PADDLE_H / 2, w: PADDLE_W, h: PADDLE_H, dy: 0, score: 0 };

        const ball = {
            x: W / 2,
            y: H / 2,
            r: BALL_R,
            dx: (Math.random() > 0.5 ? 1 : -1) * 4.0,
            dy: (Math.random() > 0.5 ? 1 : -1) * 2.8
        };

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W') p1.dy = -SPEED;
            if (e.key === 's' || e.key === 'S') p1.dy = SPEED;
            if (e.key === 'ArrowUp') { p2.dy = -SPEED;
                e.preventDefault(); }
            if (e.key === 'ArrowDown') { p2.dy = SPEED;
                e.preventDefault(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === 's' || e.key === 'S') p1.dy = 0;
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') p2.dy = 0;
        });

        function resetBall(direction) {
            ball.x = W / 2;
            ball.y = H / 2 + (Math.random() - 0.5) * 50;
            ball.dx = direction * 4.0;
            ball.dy = (Math.random() - 0.5) * 3.0;
        }

        function update() {
            p1.y += p1.dy;
            p2.y += p2.dy;
            p1.y = Math.max(0, Math.min(H - p1.h, p1.y));
            p2.y = Math.max(0, Math.min(H - p2.h, p2.y));

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.r < 0 || ball.y + ball.r > H) {
                ball.dy *= -1;
            }

            if (ball.dx < 0 &&
                ball.x - ball.r < p1.x + p1.w &&
                ball.x + ball.r > p1.x &&
                ball.y > p1.y && ball.y < p1.y + p1.h) {
                ball.dx = Math.abs(ball.dx) * 1.04;
                ball.dy += (Math.random() - 0.5) * 0.4;
            }

            if (ball.dx > 0 &&
                ball.x + ball.r > p2.x &&
                ball.x - ball.r < p2.x + p2.w &&
                ball.y > p2.y && ball.y < p2.y + p2.h) {
                ball.dx = -Math.abs(ball.dx) * 1.04;
                ball.dy += (Math.random() - 0.5) * 0.4;
            }

            if (ball.x - ball.r < 0) {
                p2.score++;
                resetBall(1);
            }
            if (ball.x + ball.r > W) {
                p1.score++;
                resetBall(-1);
            }

            scoreDisplay.innerHTML = p1.score + ' <span>·</span> ' + p2.score;
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Linha central
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.setLineDash([10, 16]);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();
            ctx.setLineDash([]);

            // Círculo central
            ctx.strokeStyle = 'rgba(255,255,255,0.025)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, 46, 0, Math.PI * 2);
            ctx.stroke();

            // Paddles
            ctx.shadowColor = '#6b8af5';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#6b8af5';
            ctx.fillRect(p1.x, p1.y, p1.w, p1.h);

            ctx.shadowColor = '#d4a54a';
            ctx.shadowBlur = 18;
            ctx.fillStyle = '#d4a54a';
            ctx.fillRect(p2.x, p2.y, p2.w, p2.h);
            ctx.shadowBlur = 0;

            // Bola
            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 22;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Placar decorativo (grande e transparente)
            ctx.font = '64px Inter, sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p1.score + ' · ' + p2.score, W / 2, H / 2 + 2);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
